# Review these paid resource plans before creating the Blueprint in Render.
services:
  - type: web
    name: edible-shop-staging
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: staging
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run lint && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edible-shop-staging-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: APP_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: edible-shop-staging-db
    plan: 0.1c-256mb
    diskSizeGB: 5
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: edible_shop_staging
    user: edible_shop_staging
    ipAllowList: []
